workers_dev = false

[vars]
# Set to the production Pages origin before scheduling copywriting jobs.
PUBLIC_APP_URL = ""

[triggers]
crons = ["*/10 * * * *"]

# IMPORTANT: verify this ID against the intended Cloudflare account before deploying.
